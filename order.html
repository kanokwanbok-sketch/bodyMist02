<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สั่งซื้อ — Body Scent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600&family=Noto+Serif+Thai:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    :root { --font-display: 'Playfair Display', 'Noto Serif Thai', Georgia, serif; }
    h1, h2, h3 { letter-spacing: 0; }
    a:focus-visible, button:focus-visible { outline: 2px solid var(--color-bronze); outline-offset: 3px; }

    .order-layout { max-width: 640px; padding-block: clamp(40px, 6vw, 76px) var(--section-space); }
    .order-layout h1 { font-size: clamp(32px, 5vw, 52px); line-height: 1.3; }
    .order-layout > p { margin: 16px 0 0; color: var(--color-muted); }

    .order-form { margin-top: clamp(28px, 4vw, 44px); padding: clamp(22px, 4vw, 40px); border: 1px solid var(--color-line); background: var(--color-white); }
    .field { margin-bottom: 22px; }
    .field label { display: block; margin-bottom: 8px; font-size: 13px; font-weight: 500; }
    .field .hint { display: block; margin-top: 6px; color: var(--color-muted); font-size: 12px; }
    textarea.input { min-height: 110px; resize: vertical; }
    .input:focus-visible { outline: 2px solid var(--color-bronze); outline-offset: 2px; }
    .order-form .button { width: 100%; margin-top: 8px; }
    .back-link { display: inline-block; margin-top: 22px; color: var(--color-muted); font-size: 13px; }
    .back-link:hover { color: var(--color-bronze); }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container navbar">
      <a class="brand" href="index.html">Body Scent</a>
      <nav class="nav-links" aria-label="เมนูหลัก">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้า</a>
      </nav>
    </div>
  </header>

  <main class="container order-layout">
    <h1>สั่งซื้อสินค้า</h1>
    <p>กรอกข้อมูลด้านล่าง เราจะติดต่อกลับเพื่อยืนยันคำสั่งซื้อและแจ้งวิธีชำระเงิน</p>

    <form id="orderForm" class="order-form">
      <div class="field">
        <label for="customerName">ชื่อลูกค้า</label>
        <input class="input" type="text" id="customerName" name="customerName" autocomplete="name" required>
      </div>

      <div class="field">
        <label for="contact">เบอร์โทร / Line</label>
        <input class="input" type="text" id="contact" name="contact" autocomplete="tel" required>
      </div>

      <div class="field">
        <label for="items">รายการสินค้า</label>
        <input class="input" type="text" id="items" name="items" required>
      </div>

      <div class="field">
        <label for="total">จำนวนเงินรวม (บาท)</label>
        <input class="input" type="text" id="total" name="total" inputmode="decimal" required>
      </div>

      <div class="field">
        <label for="note">หมายเหตุ <span class="text-muted">(ไม่บังคับ)</span></label>
        <textarea class="input" id="note" name="note" rows="4"></textarea>
        <span class="hint">เช่น ที่อยู่จัดส่ง หรือจำนวนที่ต้องการเพิ่ม</span>
      </div>

      <button type="submit" class="button">ยืนยันสั่งซื้อ</button>
    </form>

    <a class="back-link" href="product.html">กลับไปเลือกสินค้า</a>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer__bottom" style="border-top: 0; padding-top: 0;">
        <span>Body Scent</span>
        <span>&copy; 2026 Body Scent</span>
      </div>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
