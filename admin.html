<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>รายการสั่งซื้อ — Body Scent Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600&family=Noto+Serif+Thai:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    :root { --font-display: 'Playfair Display', 'Noto Serif Thai', Georgia, serif; }
    h1, h2, h3 { letter-spacing: 0; }
    .admin-head { padding-block: clamp(40px, 6vw, 76px) clamp(24px, 3vw, 36px); }
    .admin-head h1 { font-size: clamp(30px, 4.5vw, 48px); line-height: 1.3; }
    .admin-head p { margin: 12px 0 0; color: var(--color-muted); }

    .table-wrap { overflow-x: auto; border: 1px solid var(--color-line); background: var(--color-white); }
    #ordersTable { width: 100%; min-width: 860px; border-collapse: collapse; font-size: 14px; }
    #ordersTable th,
    #ordersTable td { padding: 14px 16px; border-bottom: 1px solid var(--color-line); text-align: left; vertical-align: top; }
    #ordersTable th { background: var(--color-cream); font-size: 12px; font-weight: 600; letter-spacing: .06em; white-space: nowrap; }
    #ordersTable tbody tr:last-child td { border-bottom: 0; }
    #ordersTable tbody tr:hover td { background: var(--color-ivory); }
    #ordersTable td:nth-child(1) { white-space: nowrap; color: var(--color-muted); }
    #ordersTable td:nth-child(5) { white-space: nowrap; font-weight: 600; }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container navbar">
      <a class="brand" href="index.html">Body Scent</a>
      <nav class="nav-links" aria-label="เมนูหลัก">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้า</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="container admin-head">
      <h1>รายการสั่งซื้อ</h1>
      <p>เรียงจากรายการล่าสุดขึ้นก่อน</p>
    </section>

    <section class="container" style="padding-bottom: var(--section-space);">
      <div class="table-wrap">
        <table id="ordersTable">
          <thead>
            <tr>
              <th scope="col">วันเวลา</th>
              <th scope="col">ชื่อลูกค้า</th>
              <th scope="col">เบอร์โทร/Line</th>
              <th scope="col">รายการสินค้า</th>
              <th scope="col">จำนวนเงินรวม</th>
              <th scope="col">หมายเหตุ</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer__bottom" style="border-top: 0; padding-top: 0;">
        <span>Body Scent</span>
        <span>&copy; 2026 Body Scent</span>
      </div>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
