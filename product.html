<!DOCTYPE html>

  <link rel="stylesheet" href="style.css">
  <style>
    :root { --font-display: 'Playfair Display', 'Noto Serif Thai', Georgia, serif; }
    h1, h2, h3 { letter-spacing: 0; }
    a:focus-visible, button:focus-visible { outline: 2px solid var(--color-bronze); outline-offset: 3px; }
    .page-title { padding-block: clamp(40px, 6vw, 76px) clamp(24px, 3vw, 36px); }
    .page-title h1 { font-size: clamp(32px, 5vw, 56px); line-height: 1.3; }
    .page-title p { max-width: 520px; margin: 16px 0 0; color: var(--color-muted); }
    #filter-bar { margin-bottom: clamp(28px, 4vw, 44px); }
    .product-card__info .button { margin-top: 16px; }
    .product-card__image img { background: var(--color-cream); }

<body>

  <header class="site-header">

  <footer class="site-footer">
